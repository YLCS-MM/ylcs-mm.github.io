<!DOCTYPE html>
<html lang="zh-CN">

<head>
    {% include head-base.html %}

    <style>
        :root {
            --neko-pink: #ff69b4;
            --neko-light-pink: #ffb6c1;
            --neko-pastel-pink: #ffe4ec;
            --neko-blue: #87ceeb;
            --neko-dark: #4a4a4a;
            --neko-gray: #888;
            --neko-white: #fff;
        }

        body {
            background: linear-gradient(180deg, #fef5f9 0%, #f0f8ff 50%, #fef5f9 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .post-nav {
            text-align: center;
            padding: 16px 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neko-pastel-pink);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .post-nav a {
            display: inline-block;
            color: var(--neko-gray);
            text-decoration: none;
            padding: 8px 18px;
            margin: 0 4px;
            border-radius: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .post-nav a:hover {
            color: var(--neko-pink);
            background: var(--neko-pastel-pink);
            transform: translateY(-2px);
        }

        /* 🍔 TOC 汉堡按钮 */
        .toc-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: var(--neko-pink);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.3s;
        }

        .toc-toggle:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        /* 📑 目录侧边栏 */
        .toc-sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, #fff9e6, #fff0f5);
            z-index: 1000;
            padding: 24px 18px;
            transition: right 0.35s ease;
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            border-left: 2px solid var(--neko-light-pink);
        }

        .toc-sidebar.open {
            right: 0;
        }

        .toc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--neko-pink);
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--neko-light-pink);
        }

        .toc-close {
            background: none;
            border: none;
            color: var(--neko-pink);
            font-size: 1.2em;
            cursor: pointer;
        }

        .toc-item {
            margin-bottom: 4px;
        }

        .toc-link {
            display: block;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--neko-gray);
            text-decoration: none;
            font-size: 0.85em;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .toc-link:hover {
            background: rgba(255, 182, 193, 0.15);
            color: var(--neko-pink);
            border-left-color: var(--neko-light-pink);
        }

        .toc-link.active {
            color: var(--neko-pink);
            font-weight: 600;
            background: rgba(255, 105, 180, 0.08);
            border-left-color: var(--neko-pink);
        }

        .toc-bullet {
            margin-right: 6px;
        }

        .toc-level-3 .toc-link {
            padding-left: 28px;
        }

        .toc-level-4 .toc-link {
            padding-left: 40px;
        }

        .toc-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .toc-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: var(--neko-white);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.08);
            border: 1px solid var(--neko-pastel-pink);
        }

        .post-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--neko-light-pink);
        }

        .post-title {
            font-size: 1.8em;
            color: var(--neko-pink);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .post-meta {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            color: var(--neko-gray);
            font-size: 0.9em;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .post-content {
            line-height: 1.8;
            color: var(--neko-dark);
        }

        .post-content h1,
        .post-content h2,
        .post-content h3 {
            color: var(--neko-pink);
            margin: 1.5em 0 0.5em;
        }

        .post-content h2 {
            border-left: 3px solid var(--neko-pink);
            padding-left: 12px;
        }

        .post-content a {
            color: var(--neko-pink);
            text-decoration: none;
            border-bottom: 1px dotted var(--neko-light-pink);
        }

        .post-content a:hover {
            color: #ff1493;
            border-bottom-style: solid;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .post-content blockquote {
            border-left: 4px solid var(--neko-light-pink);
            padding: 10px 20px;
            margin: 16px 0;
            background: linear-gradient(135deg, #fff0f5, #fff9e6);
            border-radius: 0 10px 10px 0;
            color: var(--neko-gray);
        }

        .post-content code {
            background: var(--neko-pastel-pink);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .post-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--neko-pastel-pink);
        }

        .post-content pre code {
            background: none;
            color: inherit;
        }

        .post-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--neko-light-pink);
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .post-tag {
            display: inline-block;
            background: var(--neko-pastel-pink);
            color: var(--neko-pink);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            text-decoration: none;
            transition: all 0.2s;
        }

        .post-tag:hover {
            background: var(--neko-pink);
            color: white;
        }

        .post-thanks {
            color: var(--neko-gray);
            font-size: 0.9em;
        }

        .neko-paw {
            display: inline-block;
            animation: pawBounce 1.5s infinite;
        }

        @keyframes pawBounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-3px)
            }
        }

        .bottom-decoration {
            text-align: center;
            padding: 30px 20px;
            color: var(--neko-light-pink);
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 20px;
                margin: 16px 12px;
                border-radius: 14px;
            }

            .post-title {
                font-size: 1.4em;
            }

            .post-nav a {
                padding: 6px 12px;
                font-size: 0.85em;
            }

            .toc-toggle {
                top: 10px;
                right: 10px;
                width: 38px;
                height: 38px;
            }

            .toc-sidebar {
                width: 85%;
                right: -100%;
            }
        }
    </style>
</head>

<body>
    <!-- 🎀 导航栏 -->
    <nav class="post-nav">
        <a href="/">🏠 首页</a>
        <a href="/announcements/">📢 公告</a>
        <a href="/about/">🐱 关于</a>
    </nav>

    <!-- 🍔 TOC 按钮 -->
    <button class="toc-toggle" id="tocToggle" title="目录">📑</button>

    <div class="toc-overlay" id="tocOverlay"></div>

    <aside class="toc-sidebar" id="tocSidebar">
        <div class="toc-header">
            <span>📑 文章目录</span>
            <button class="toc-close" id="tocClose">✕</button>
        </div>
        <ul id="tocList"></ul>
    </aside>

    <div class="container">
        <article class="post">
            {% include post-header.html %}

            <div class="post-content">
                {{ content }}
            </div>

            {% include post-footer.html %}
        </article>
    </div>

    <div class="bottom-decoration">
        🐾 ฅ(^•ω•^)ฅ 🐾
    </div>

    {% include footer.html %}

    <script>
        (function () {
            const tocToggle = document.getElementById('tocToggle');
            const tocSidebar = document.getElementById('tocSidebar');
            const tocOverlay = document.getElementById('tocOverlay');
            const tocList = document.getElementById('tocList');
            const tocClose = document.getElementById('tocClose');

            function openToc() {
                tocSidebar.classList.add('open');
                tocOverlay.classList.add('open');
            }
            function closeToc() {
                tocSidebar.classList.remove('open');
                tocOverlay.classList.remove('open');
            }

            tocToggle.addEventListener('click', function () {
                tocSidebar.classList.contains('open') ? closeToc() : openToc();
            });
            tocClose.addEventListener('click', closeToc);
            tocOverlay.addEventListener('click', closeToc);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeToc();
            });

            // 生成目录
            const headings = document.querySelectorAll('.post-content h2, .post-content h3, .post-content h4');
            headings.forEach(function (h, i) {
                if (!h.id) h.id = 'toc-' + i;
                const li = document.createElement('li');
                li.className = 'toc-item';
                const level = parseInt(h.tagName.substring(1));
                if (level === 3) li.classList.add('toc-level-3');
                if (level === 4) li.classList.add('toc-level-4');
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.className = 'toc-link';
                a.innerHTML = '<span class="toc-bullet">🐾</span>' + h.textContent;
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    closeToc();
                    setTimeout(function () {
                        document.getElementById(h.id).scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                });
                li.appendChild(a);
                tocList.appendChild(li);
            });

            // 滚动高亮
            const links = document.querySelectorAll('.toc-link');
            window.addEventListener('scroll', function () {
                let active = -1;
                for (let i = headings.length - 1; i >= 0; i--) {
                    if (headings[i].getBoundingClientRect().top <= 120) {
                        active = i;
                        break;
                    }
                }
                links.forEach(function (l, i) {
                    l.classList.toggle('active', i === active);
                });
            });
        })();
    </script>
</body>

</html>
