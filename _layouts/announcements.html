<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} &mdash; {% endif %}{{ site.title }}</title>

    <link rel="stylesheet" href="/assets/vendor/primer-css/css/primer.css">

    <style>
        :root {
            --neko-pink: #ff69b4;
            --neko-light-pink: #ffb6c1;
            --neko-pastel-pink: #ffe4ec;
            --neko-blue: #87ceeb;
            --neko-dark: #4a4a4a;
            --neko-gray: #888;
            --neko-white: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #fef5f9 0%, #f0f8ff 50%, #fef5f9 100%);
            min-height: 100vh;
            color: var(--neko-dark);
            line-height: 1.6;
        }

        .page-nav {
            text-align: center;
            padding: 16px 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neko-pastel-pink);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-nav a {
            display: inline-block;
            color: var(--neko-gray);
            text-decoration: none;
            padding: 8px 18px;
            margin: 0 4px;
            border-radius: 20px;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .page-nav a:hover {
            color: var(--neko-pink);
            background: var(--neko-pastel-pink);
            transform: translateY(-2px);
        }

        .page-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .bottom-decoration {
            text-align: center;
            padding: 30px 20px;
            color: var(--neko-light-pink);
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .page-nav a {
                padding: 6px 12px;
                font-size: 0.85em;
            }

            .page-container {
                padding: 0 12px;
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>
    <!-- 🎀 导航栏 -->
    <nav class="page-nav">
        <a href="/">🏠 首页</a>
        <a href="/announcements/">📢 公告</a>
        <a href="/about/">🐱 关于</a>
    </nav>

    <main class="page-container">
        {{ content }}
    </main>

    <div class="bottom-decoration">
        🐾 ฅ(^•ω•^)ฅ 🐾
    </div>

    {% include footer.html %}
</body>

</html>
