# ---------------- #
#   Main Configs   #
# ---------------- #

# 网站根路径，留空表示部署在域名根目录
baseurl:
# 网站完整URL
url: https://ylcs-mm.github.io
# 日期显示格式，"ordinal" 表示序数格式（如 "1st"）
date_format: "ordinal"
# 网站标题
title: 成霜喵喵
# 网站副标题
subtitle: "成霜喵喵的小窝"
# 网站描述，用于SEO和社交分享
description: "成霜喵喵的小窝，然后就布吉岛喏喵"
# 网站关键词，用于SEO
keywords: 成霜喵喵, 甘城なつき，猫羽雫，喵星人
# 网站时区
timezone: Asia/Shanghai
# 字符编码
encoding: "utf-8"
# 页面左下角显示的年份
since: 2025
# 源码仓库，请替换成自己的
repository: ylcs-mm.github.io
# 对 css 和 js 资源的 cdn 加速配置
cdn:
    jsdelivr:
        # 是否启用 jsdelivr CDN 加速
        enabled: false
# 可选组件配置
components:
    # 分享
    # 支持的分享平台：weibo,qq,wechat,douban,qzone,linkedin,facebook,twitter
    share:
        # 是否启用分享功能
        enabled: true
        # 隐藏的分享平台列表
        hide-platforms: qq,facebook
    # 不蒜子访问统计
    busuanzi:
        # 是否启用不蒜子统计
        enabled: true
        # 统计开始日期
        start_date: 2025-06-19
    # 文章字数统计
    word_count:
        # 是否启文章字数统计
        enabled: false
    # 页面右上角，以及「关于」页面的二维码
    # 修改图片请替换 assets/images/qrcode.jpg
    qrcode:
        # 是否启用二维码展示
        enabled: false
        # 二维码图片的替代文本
        image_alt: 的程序
    

# ---------------- #
#      Author      #
# ---------------- #
# 作者名
author: 成霜·喵喵
# 所属组织
organization: 
# 组织URL
organization_url: 
# GitHub 用户名
github_username: ylcs-mm
# 所在地
location: 湖南，郴州
# 电子邮箱
email: 2992412549@qq.com

# ---------------- #
#      Jekyll      #
# ---------------- #
# Markdown 渲染引擎
markdown: kramdown
# kramdown 渲染器配置
kramdown:
    # 输入格式，GFM 表示 GitHub Flavored Markdown
    input: GFM
    # 是否自动为标题生成ID
    auto_ids: true
    # 目录包含的标题级别范围
    toc_levels: 2..4
    # 是否禁用硬换行转换
    hard_wrap: false
    # 语法高亮器
    syntax_highlighter: rouge
    # 语法高亮器选项
    syntax_highlighter_opts:
        # 行内代码配置
        span:
            # 行内代码是否显示行号
            line_numbers: false
        # 代码块配置
        block:
            # 代码块是否显示行号
            line_numbers: true
# 代码高亮器
highlighter: rouge
# 分页：每页显示的文章数
paginate: 10
# 是否启用潜在语义索引（Latent Semantic Indexing）
lsi: false
# 是否启用详细输出模式
quiet: false
# 文章摘要分隔符
excerpt_separator: "\n\n"
# 文章永久链接格式
permalink: /:year/:month/:day/:title/
# Jekyll 插件列表
plugins:
    # 代码高亮（rouge）
    - rouge
#     - jekyll-html-pipeline
    # 分页插件
    - jekyll-paginate
    # 生成站点地图
    - jekyll-sitemap
    # 生成 RSS Feed
    - jekyll-feed
    # Emoji 表情支持
    - jemoji
#     - jekyll-mentions

# ---------------- #
#      Comments    #
# ---------------- #
# 当前使用的评论系统：giscus（配置参考：https://giscus.app/zh-CN）
comments_provider: giscus
# giscus 配置 - 请替换为你自己的仓库信息
giscus:
    # 你的 GitHub 仓库（格式：owner/repo）
    repo: 
    # 你的 GitHub 仓库 ID
    repo-id: 
    # 讨论分类名称
    category: Announcements
    # 讨论分类 ID
    category-id: 
# 在使用其它评论组件时可点击显示 Disqus
lazy_load_disqus : false

# ---------------- #
#      Search      #
# ---------------- #
# 简易 Jekyll 搜索配置
simple_jekyll_search:
    # 是否支持全文搜索
    fulltext: false
    # 最多显示多少条搜索结果
    limit: 10

# ---------------- #
#     导航栏配置    #
# ---------------- #
# 导航菜单项列表
navs:
# 首页导航项
- label: 首页
  # 链接地址
  href:  /
  # 图标（Emoji）
  icon: 🏠
# 分类导航项
- label: 分类
  href: /categories/
  icon: 📁
# 关于导航项
- label: 关于
  href: /about/
  icon: 👤
# 公告导航项
- label: 公告
  href: /announcements/
  icon: 📢
  # 是否显示角标
  badge: true



# ---------------- #
#      Google      #
# ---------------- #
# Google 相关服务配置
google:
    # Google AdSense 广告配置
    adsense:
        # 是否启用 AdSense
        enabled: false
        # 是否在页脚展示广告
        footer: false
        # 是否在侧边栏展示广告
        sidebar: false
        # 是否在侧边栏详情展示广告
        sidebar-detail: false
        # 是否在内容头部展示广告
        content_header: false
        # 是否在内容尾部展示广告
        content_footer: false