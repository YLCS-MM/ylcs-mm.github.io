{{ if .Site.Params.giscus.repo }}
<div id="giscus-comments"
    style="margin-top: 30px; padding: 20px; background: var(--neko-white); border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--neko-pastel-pink);">
    <script src="https://giscus.app/client.js" data-repo="{{ .Site.Params.giscus.repo }}"
        data-repo-id="{{ .Site.Params.giscus.repoId }}" data-category="{{ .Site.Params.giscus.category }}"
        data-category-id="{{ .Site.Params.giscus.categoryId }}" data-mapping="title" data-strict="0"
        data-reactions-enabled="1" data-emit-metadata="0" data-input-position="bottom" data-theme="light"
        data-lang="zh-CN" crossorigin="anonymous" async>
        </script>
</div>
{{ end }}
