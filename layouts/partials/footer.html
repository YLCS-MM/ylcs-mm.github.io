<footer class="site-footer">
    <div class="copyright">
        © {{ .Site.Params.since }} <span title="{{ .Site.Params.author }}">{{ .Site.Params.author }}</span>
    </div>

    <ul class="site-footer-links">
        <li><a href="/">首页</a></li>
        <li><a href="/announcements/">公告</a></li>
        <li><a href="/about/">关于</a></li>
    </ul>

    <p class="footer-links-secondary">
        <a href="https://github.com/{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
        &nbsp;·&nbsp;
        <a href="mailto:{{ .Site.Params.email }}">Email</a>
    </p>
</footer>

{{ if .Site.Params.share.enabled }}
<script src="/assets/vendor/share.js/dist/js/share.min.js"></script>
{{ end }}

<script>
    (function () {
        var d = document, w = window.innerWidth;
        window.live2d_widgets = {
            modelPath: "https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/models/neko/",
            display: {
                position: "fixed",
                right: w < 640 ? 2 : 12,
                bottom: w < 640 ? 8 : 20,
                left: "auto",
                width: w < 640 ? 110 : 160,
                height: w < 640 ? 220 : 320,
                zIndex: 999998,
            },
            mobile: { show: true, scale: 0.65 },
        };
    })();
</script>
<script async src="https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/dist/autoload.js"></script>

{{ if .Site.Params.announcement.popupEnabled }}
{{ partial "announcement-popup.html" . }}
{{ end }}
