<style>
    #waifu,
    #live2d-widget,
    #live2d,
    .waifu {
        position: fixed !important;
        right: 0 !important;
        bottom: 0 !important;
        left: auto !important;
        top: auto !important;
        z-index: 99999 !important;
        pointer-events: none !important;
    }

    @media (max-width: 640px) {

        #waifu,
        #live2d-widget,
        #live2d,
        .waifu {
            transform: scale(0.55) !important;
            transform-origin: bottom right !important;
        }
    }
</style>
<script>
    window.live2d_widgets = {
        modelPath: "https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/models/tororo/",
        display: { position: "right", width: 150, height: 300 },
        mobile: { show: true, width: 90, height: 180 },
    };
</script>
<script async src="https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/dist/autoload.js"></script>
<script>
    (function forcePosition() {
        var n = 0;
        var t = setInterval(function () {
            n++;
            var el = document.getElementById("waifu") || document.querySelector("#live2d-widget") || document.querySelector("[class*='live2d']");
            if (!el && n >= 30) { clearInterval(t); return; }
            if (!el) return;
            clearInterval(t);
            ["position", "right", "bottom", "left", "top", "zIndex", "pointerEvents"].forEach(function (p) {
                el.style.removeProperty(p);
            });
            el.style.setProperty("position", "fixed", "important");
            el.style.setProperty("right", "0", "important");
            el.style.setProperty("bottom", "0", "important");
            el.style.setProperty("left", "auto", "important");
            el.style.setProperty("top", "auto", "important");
            el.style.setProperty("z-index", "99999", "important");
            el.style.setProperty("pointer-events", "none", "important");
            if (window.innerWidth < 640) {
                el.style.setProperty("transform", "scale(0.55)", "important");
                el.style.setProperty("transform-origin", "bottom right", "important");
            }
        }, 300);
    })();
</script>
{{ if .Site.Params.announcement.popupEnabled }}
{{ partial "announcement-popup.html" . }}
{{ end }}
