<footer class="container">

  <div class="site-footer" role="contentinfo">
    <div class="copyright left mobile-block">
      © {{ site.since }}
      <span title="{{ site.author}}">{{ site.author }}</span>
      <a href="javascript:window.scrollTo(0,0)" class="right mobile-visible">TOP</a>
    </div>

    <ul class="site-footer-links right mobile-hidden">
      <li>
        <a href="javascript:window.scrollTo(0,0)">TOP</a>
      </li>
    </ul>
    <a href="{{ site.github.repository_url }}" target="_blank" aria-label="view source code">
      <span class="mega-octicon octicon-mark-github" title="GitHub"></span>
    </a>
    <ul class="site-footer-links mobile-hidden">
      {% for nav in site.navs %}
      <li>
        <a href="{{ site.url }}{{ nav.href }}" title="{{ nav.label }}" target="{{ nav.target | default: _self }}">{{
          nav.label }}</a>
      </li>
      {% endfor %}
    </ul>

    {% include visit-stat.html %}

  </div>
</footer>
<div class="tools-wrapper">
  <a class="gotop" href="#" title="回到顶部"><span class="octicon octicon-arrow-up"></span></a>
</div>
<!-- / footer -->
{% if site.components.share.enabled %}
<script src="{{ assets_base_url }}/assets/vendor/share.js/dist/js/share.min.js"></script>
{% endif %}


<!-- 配置 Live2D 看板娘模型（必须放在 autoload.js 之前） -->
<script>
  window.live2d_widgets = {
    // 模型路径（根据仓库结构调整，假设“来源”对应“models”目录）
    modelPath: "https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/models/neko/",
    // 解释：  
    // - "https://fastly.jsdelivr.net/"：JSDelivr CDN，加速模型加载；  
    // - "npm/live2d-widgets@1.0.0-rc.6"：指定库的版本（避免更新导致问题）；  
    // - "models/neko/"：模型文件的实际目录（neko是猫娘模型，没错！）。
    // 显示配置（调整位置和大小，适配你的博客）
    display: {
      position: "fixed",      // ① 固定在屏幕视口（关键！只有固定才能用right/bottom）；  
      right: 15,              // ② 距离右边15px（不贴边，更可爱）；  
      bottom: 25,             // ③ 距离底部25px（刚好在右下角，不挡导航）；  
      left: "auto",           // ④ 取消左边的固定（避免和right冲突，必须写！）；  
      width: 160,             // ⑤ 看板娘宽度（160px刚好，不占太多空间）；  
      height: 320,            // ⑥ 看板娘高度（320px，比例协调）；  
      zIndex: 999999,         // ⑦ 层级拉到最高（999999），不会被任何元素（比如导航、卡片）挡住；  
      transform: "none",      // ⑧ 取消默认的缩放/平移（避免位置偏移）；  
    },
    // 移动端适配（确保手机显示正常）
    mobile: {
      show: true,             // ① 强制在手机端显示（默认可能隐藏，必须开！）；  
      scale: 0.75,            // ② 缩小到75%（160px×0.75=120px，刚好适合手机屏幕）；  
      position: "fixed",      // ③ 手机端也固定在右下角；  
      right: 10,              // ④ 手机端距离右边10px；  
      bottom: 15,             // ⑤ 手机端距离底部15px；  
    },
  };
</script>

<!-- 加载看板娘核心脚本（保持不变） -->
<script src="https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.6/dist/autoload.js"></script>

{% if site.data.announcement.popup_enabled %}
{% include announcement-popup.html %}
{% endif %}


</body>

</html>
